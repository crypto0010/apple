[project]
name = "apple-bench"
version = "0.1.0"
description = "Hardware-grounded benchmark of apple leaf disease classifiers"
# Python 3.10 is required because the Jetson PyTorch wheels (jp6/cu126) are
# only built as cp310. See ruff.toml and tool.uv.sources below.
requires-python = ">=3.10.12,<3.11"
dependencies = [
  # torch + torchvision come from the Jetson index so we get CUDA-enabled
  # aarch64 builds. The version pins match what's available in jp6/cu126.
  "torch==2.8.0",
  "torchvision==0.23.0",
  "timm==1.0.11",
  "ultralytics==8.3.27",
  "scikit-learn==1.5.2",
  "scikit-image==0.24.0",
  "numpy==1.26.4",
  "pillow==11.0.0",
  "pandas==2.2.3",
  "pyyaml==6.0.2",
  "tqdm==4.67.0",
  "requests==2.32.5",  # onnx2tf pins this exactly
  "onnx==1.19.1",  # bumped from 1.17.0 to satisfy onnx2tf 1.29.24
  "onnxruntime-gpu==1.23.0",
  # Analysis stack (Plan A.3). scipy + seaborn are already transitively
  # present via scikit-image / ultralytics; pin explicitly so the lock
  # survives a uv sync --upgrade.
  "matplotlib==3.9.2",
  "scipy==1.15.3",
  "seaborn==0.13.2",
  # ESP32-S3-CAM TFLite-Micro tier (Plan A.2 Tasks 5, 9, 17-18).
  # The plan originally specified ai-edge-torch, but it pins torch<2.7
  # which conflicts with the Jetson cu126 torch 2.8 wheel.  onnx2tf is
  # the workable alternative: PyTorch -> ONNX -> TFLite via TensorFlow.
  # The price is a heavy TF/protobuf install (onnxoptimizer builds from
  # source on aarch64) and the NCHW -> NHWC layout conversion handled by
  # src/apple_bench/runners/tflite_runner.py.  PlatformIO for the ESP32
  # firmware is brought in as a dev tool so the host can flash and bench.
  "onnx2tf==1.29.24",
  "tensorflow==2.19.0",
  "tf-keras==2.19.0",
  "onnx-graphsurgeon==0.5.8",
  "sng4onnx==2.0.1",
  "ai-edge-litert==2.1.0",
  "pyserial==3.5",
]

[project.optional-dependencies]
esp32 = [
  # PlatformIO is a build tool for the ESP32 firmware.  Kept in an
  # optional extra so non-MCU users (the Jetson-only flow) aren't forced
  # to download the xtensa toolchain (~300 MB on first build).
  "platformio==6.1.19",
]

dev = [
  "pytest==8.3.3",
  "pytest-cov==6.0.0",
  "ruff==0.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --strict-markers"

# --- uv configuration: fetch torch+torchvision from the Jetson AI Lab index ---
# This index is community-maintained and ships NVIDIA's prebuilt PyTorch wheels
# for L4T R36.x / JetPack 6.x with CUDA 12.6. PyPI's aarch64 wheels are CPU-only,
# which is why we override only these two packages.
[[tool.uv.index]]
name = "jetson"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126/+simple/"
explicit = true

[tool.uv.sources]
torch = { index = "jetson" }
torchvision = { index = "jetson" }
onnxruntime-gpu = { index = "jetson" }
