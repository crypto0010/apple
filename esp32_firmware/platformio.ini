; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = diagnostic

[env]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0
; Custom partition table — gives app 6 MB so the embedded EfficientNet-Lite0
; INT8 model (~4 MB) fits alongside TFLM + Arduino framework code.
board_build.partitions = huge_app_8mb.csv
board_build.flash_size = 8MB
board_build.arduino.memory_type = qio_opi
build_flags = 
	-D BOARD_HAS_PSRAM
	-D CONFIG_SPIRAM_MODE_OCT=1
	-D ARDUINO_USB_CDC_ON_BOOT=1
	-D ARDUINO_USB_MODE=1

[env:diagnostic]
build_src_filter = +<diagnostic.cpp>

[env:inference]
build_src_filter = +<main.cpp>
lib_deps = johnosbb/MicroTFLite@^1.0.4
build_unflags = 
	-std=gnu++11
build_flags = 
	${env.build_flags}
	-std=gnu++17
	-DTF_LITE_DISABLE_X86_NEON
	-DTF_LITE_STATIC_MEMORY
